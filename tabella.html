<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tabella Dinamica</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { margin: 5px 0; padding: 8px; display: block; }
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
  </style>
</head>
<body>

  <input type="text" id="nome" placeholder="Nome">
  <input type="text" id="cognome" placeholder="Cognome">
  <input type="text" id="indirizzo" placeholder="Indirizzo">
  <input type="text" id="citta" placeholder="Città">
  <input type="number" id="eta" placeholder="Età">

  <button onclick="aggiungi()">Aggiungi</button>

  <table id="tabella">
    <tr>
      <th>Nome</th><th>Cognome</th><th>Indirizzo</th><th>Città</th><th>Età</th>
    </tr>
  </table>

  <script>
    function aggiungi() {
      var n = document.getElementById("nome").value;
      var c = document.getElementById("cognome").value;
      var i = document.getElementById("indirizzo").value;
      var ci = document.getElementById("citta").value;
      var e = document.getElementById("eta").value;

      var riga = "<tr><td>" + n + "</td><td>" + c + "</td><td>" + i + "</td><td>" + ci + "</td><td>" + e + "</td></tr>";
      
      document.getElementById("tabella").innerHTML += riga;
    }
  </script>

</body>
</html>
