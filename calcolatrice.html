<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Calcolatrice</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    nav { margin-bottom: 15px; }
    input { margin: 5px 0; padding: 10px; display: block; width: 200px; box-sizing: border-box; }
    .ops { display: flex; gap: 5px; width: 200px; margin: 10px 0; }
    .ops button { flex: 1; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Tabella Utenti</a> | 
    <a href="calcolatrice.html">Calcolatrice</a>
  </nav>
  <hr>

  <h2>Calcolatrice</h2>
  <input type="number" id="n1" placeholder="Numero 1">
  <input type="number" id="n2" placeholder="Numero 2">

  <div class="ops">
    <button onclick="calcola('+')">+</button>
    <button onclick="calcola('-')">-</button>
    <button onclick="calcola('*')">*</button>
    <button onclick="calcola('/')">/</button>
  </div>

  <p>Risultato: <strong id="res">0</strong></p>

  <script>
    function calcola(op) {
      let a = Number(document.getElementById("n1").value);
      let b = Number(document.getElementById("n2").value);
      let r = 0;

      switch (op) {
        case "+":
          r = a + b;
          break;
        case "-":
          r = a - b;
          break;
        case "*":
          r = a * b;
          break;
        case "/":
          if (b == 0) {
            r = "impossibile";
          } else {
            r = a / b;
          }
          break;
      }

      document.getElementById("res").textContent = r;
    }
  </script>

</body>
</html>
